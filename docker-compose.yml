# 一键启动：./scripts/build.sh && docker compose up -d --build
# Ollama 运行在宿主机（使用 GPU），容器内通过 host.docker.internal:11434 访问。
name: agent-stack
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass123}
      POSTGRES_DB: new-api
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: pg_isready -U root -d new-api
      interval: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: stack-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devpass123}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpass123}", "ping"]
      interval: 5s
      retries: 10

  new-api:
    build: ./deploy/new-api
    image: agent-stack/new-api:local
    container_name: stack-new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    environment:
      SQL_DSN: postgresql://root:${POSTGRES_PASSWORD:-devpass123}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:-devpass123}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me}
      TZ: Asia/Singapore
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - new_api_data:/data
      - ./runtime/new-api/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  new_api_data:
